name: Build Notes APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Build APK Debug (sans wrapper)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notes-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Push APK to releases folder
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          mkdir -p releases
          cp "$APK" releases/Notes-debug.apk
          git config user.email "bot@github.com"
          git config user.name "builder-bot"
          git add releases/Notes-debug.apk
          git commit -m "APK auto-built" || true
          git push origin HEAD:main || true
