name: Build Notes APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build APK Debug
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.6
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notes-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to releases folder
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/Notes-debug.apk
          git config user.email "bot@github.com"
          git config user.name "builder-bot"
          git add releases/Notes-debug.apk || true
          git commit -m "APK built ${{ github.sha }}" || true
          git push origin HEAD:main || true
